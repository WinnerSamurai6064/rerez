<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Rerez - Free image upscaling platform"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#000000" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Rerez" />

    <link rel="manifest" href="manifest.json" />

    <title>Rerez</title>

    <style>
      :root {
        color-scheme: dark;
        --black: #000000;
        --orange: #ff7a1a;
        --deep-orange: #ff4f0a;
        --white: #f7fbff;
        --muted: rgba(247, 251, 255, 0.68);
        --glass: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.16);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 75% 20%,
            rgba(255, 122, 26, 0.22),
            transparent 34rem
          ),
          radial-gradient(
            circle at 18% 0%,
            rgba(255, 255, 255, 0.08),
            transparent 26rem
          ),
          var(--black);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 75% 20%,
            rgba(255, 122, 26, 0.18),
            transparent 34rem
          ),
          #000000;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-card {
        width: min(86vw, 360px);
        padding: 34px 24px;
        border: 1px solid var(--border);
        border-radius: 34px;
        background:
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.11),
            rgba(255, 255, 255, 0.045)
          ),
          rgba(18, 14, 10, 0.78);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.58),
          0 0 52px rgba(255, 122, 26, 0.12);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .loader-logo {
        width: 86px;
        height: 86px;
        margin: 0 auto 18px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, var(--orange), var(--deep-orange));
        box-shadow:
          0 18px 38px rgba(255, 122, 26, 0.26),
          0 0 42px rgba(255, 122, 26, 0.18);
        color: white;
        font-size: 36px;
        font-weight: 950;
        letter-spacing: -0.08em;
      }

      .loader-title {
        margin: 0;
        color: var(--white);
        font-size: 46px;
        line-height: 0.95;
        font-weight: 950;
        letter-spacing: -0.07em;
      }

      .loader-subtitle {
        margin: 12px 0 24px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.4;
        font-weight: 700;
      }

      .loader-bar {
        position: relative;
        width: 100%;
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
      }

      .loader-bar::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--orange), var(--deep-orange));
        box-shadow: 0 0 24px rgba(255, 122, 26, 0.44);
        animation: loading-slide 1.1s ease-in-out infinite;
      }

      @keyframes loading-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(240%);
        }
      }
    </style>
  </head>

  <body>
    <div id="loading-screen">
      <div class="loader-card">
        <div class="loader-logo">R</div>
        <h1 class="loader-title">Rerez</h1>
        <p class="loader-subtitle">Free image upscaling platform</p>
        <div class="loader-bar"></div>
      </div>
    </div>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        const loadingScreen = document.getElementById("loading-screen");

        if (loadingScreen) {
          loadingScreen.classList.add("hidden");

          window.setTimeout(function () {
            loadingScreen.remove();
          }, 320);
        }
      });
    </script>
  </body>
</html>
